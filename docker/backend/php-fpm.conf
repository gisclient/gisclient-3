[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = apache
group = apache
listen = 9000
chdir = /app/
access.log = /proc/self/fd/2

; Il formato di default non riporta la durata, quindi l'access log dice cosa
; e' stato chiesto ma non quanto e' costato. %{milliseconds}d la aggiunge;
; %{HTTP_X_REQUEST_ID}e lega la riga alla richiesta che ha originato la catena.
access.format = "%R %{HTTP_X_REQUEST_ID}e \"%m %r%Q%q\" %s %{milliseconds}d ms %{kilo}M kB %C%%"

; Oltre la soglia php-fpm scrive nel log lo stack trace di dove si trova la
; richiesta in quel momento. E' l'unico modo, senza strumentare il codice, per
; attribuire i secondi a una fase precisa: curl_exec() dentro gcWMSMerge.php
; significa attesa delle GetMap, ms_newMapObjFromString() significa parsing del
; mapfile, owsdispatch() significa disegno e query PostGIS.
;
; 3s e' sopra qualsiasi richiesta sana e sotto il problema che stiamo cercando.
; La soglia non interrompe nulla: registra e basta.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 3s

clear_env = no
catch_workers_output = yes
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.status_path = /status
ping.path = /ping
ping.response = pong
