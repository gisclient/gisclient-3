[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = apache
group = apache
listen = 9000
chdir = /app/
access.log = /proc/self/fd/2
clear_env = no
catch_workers_output = yes
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.status_path = /status
ping.path = /ping
ping.response = pong
