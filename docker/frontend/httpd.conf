ServerRoot "/etc/httpd"

Listen ${APACHE_SERVER_PORT}

Include conf.modules.d/*.conf

User apache
Group apache

ServerAdmin root@localhost
ServerName ${APACHE_SERVER_DOCUMENT_ROOT}

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot ${APACHE_SERVER_DOCUMENT_ROOT}

<Directory "/app">
    AllowOverride None
    Require all granted
</Directory>

<Directory "/app/public">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

ErrorLog "/dev/stderr"

LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    <IfModule logio_module>
      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>

    # Il formato "combined" non registra la durata della richiesta, quindi
    # nessuno degli hop serviti da questo Apache — gcmap.php, download.php,
    # gcWMSMerge.php e le ows.php — e' misurabile dai log.
    #
    # "timing" aggiunge in coda a "combined", senza toccare i campi che lo
    # precedono (i parser esistenti continuano a funzionare):
    #
    #   %D                  durata in microsecondi
    #   %{X-Request-Id}i    id di correlazione, per gli hop che lo ricevono
    #                       come header (download.php, gcmap.php)
    #   %{GC_REQ_ID}e       id di correlazione per le ows.php, che lo ricevono
    #                       in query string (catturato sotto)
    #
    # "%m %U" e non "%r": la richiesta completa include la query string, e
    # gcWMSMerge.php accoda GC_SESSION_ID alle GetMap che genera. ows.php la
    # accetta come credenziale (GCService::startSession(true) adotta quella
    # sessione), quindi registrarla equivale a scrivere un token di accesso
    # negli access log. %U da' metodo e percorso senza la query string, e
    # l'unico parametro che serve alla correlazione viene estratto a parte in
    # GC_REQ_ID.
    #
    # Questo si discosta da "combined", che invece registra "%r": un parser
    # che si aspettava quel campo va adeguato. E' un prezzo accettabile per
    # non avere credenziali nei log.
    LogFormat "%h %l %u %t \"%m %U\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D \"%{X-Request-Id}i\" \"%{GC_REQ_ID}e\"" timing

    CustomLog "/dev/stdout" timing
</IfModule>

<IfModule rewrite_module>
    # Estrae GC_REQUEST_ID dalla query string in una variabile d'ambiente, per
    # poterlo registrare da solo invece di tutta la query string. RewriteRule
    # con "-" non riscrive nulla: imposta la variabile e passa oltre.
    RewriteEngine On
    RewriteCond %{QUERY_STRING} (?:^|&)GC_REQUEST_ID=([A-Za-z0-9._-]+)
    RewriteRule ^ - [E=GC_REQ_ID:%1]
</IfModule>

<IfModule alias_module>
    ScriptAlias /cgi-bin/ "/app/cgi-bin/"
</IfModule>

<Directory "/app/cgi-bin">
    AllowOverride None
    Options None
    Require all granted
</Directory>

<IfModule mime_module>
    TypesConfig /etc/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
    AddType text/html .shtml
    AddOutputFilter INCLUDES .shtml
</IfModule>

AddDefaultCharset UTF-8

<IfModule mime_magic_module>
    MIMEMagicFile conf/magic
</IfModule>

EnableSendfile on

IncludeOptional conf.d/*.conf
