ServerRoot "/etc/httpd"

Listen ${APACHE_SERVER_PORT}

Include conf.modules.d/*.conf

User apache
Group apache

ServerAdmin root@localhost
ServerName ${APACHE_SERVER_DOCUMENT_ROOT}

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot ${APACHE_SERVER_DOCUMENT_ROOT}

<Directory "/app">
    AllowOverride None
    Require all granted
</Directory>

<Directory "/app/public">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

ErrorLog "/dev/stderr"

LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    <IfModule logio_module>
      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>

    # Il formato "combined" non registra la durata della richiesta, quindi
    # nessuno degli hop serviti da questo Apache — gcmap.php, download.php,
    # gcWMSMerge.php e le ows.php — e' misurabile dai log.
    #
    # "timing" aggiunge in coda a "combined", senza toccare i campi che lo
    # precedono (i parser esistenti continuano a funzionare):
    #
    #   %D                  durata in microsecondi
    #   %{X-Request-Id}i    id di correlazione, per gli hop che lo ricevono
    #                       come header (download.php, gcmap.php)
    #   %q                  query string: per le ows.php porta GC_REQUEST_ID,
    #                       che la lega alla mappa che le ha generate
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D \"%{X-Request-Id}i\" \"%q\"" timing

    CustomLog "/dev/stdout" timing
</IfModule>

<IfModule alias_module>
    ScriptAlias /cgi-bin/ "/app/cgi-bin/"
</IfModule>

<Directory "/app/cgi-bin">
    AllowOverride None
    Options None
    Require all granted
</Directory>

<IfModule mime_module>
    TypesConfig /etc/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
    AddType text/html .shtml
    AddOutputFilter INCLUDES .shtml
</IfModule>

AddDefaultCharset UTF-8

<IfModule mime_magic_module>
    MIMEMagicFile conf/magic
</IfModule>

EnableSendfile on

IncludeOptional conf.d/*.conf
