Alias /author /app/author/public
<Directory "/app/author/public">
    PassEnv GISCLIENT__APP__USER
    PassEnv GISCLIENT__APP__PASSWORD

    # NEW AUTHOR VERSION
    PassEnv AUTHOR_INTERNAL_URL
    PassEnv AUTHOR_PUBLIC_URL
    PassEnv DB_HOST
    PassEnv DB_PORT
    PassEnv DB_DBNAME
    PassEnv DB_USER
    PassEnv DB_PASSWORD

    PassEnv MAP_USER
    PassEnv MAP_PASSWORD

    # Endpoint read-only per MapServer; assenti = tutto sul primary
    PassEnv MAP_DB_HOST
    PassEnv MAP_DB_NAME
    PassEnv MAP_DB_CONN_PARAMS

    # Optional — silently omitted when not defined in the container environment
    PassEnv GC_PRINT_LOGO_SX
    PassEnv GC_PRINT_LOGO_DX
    PassEnv TRUSTED_PROXIES

    RequestHeader set X-FORWARDED-PATH "/author"

    Require all granted
    AllowOverride All
</Directory>

<Location "/services/">
    RewriteEngine On
    RewriteOptions inherit
    RewriteRule ^(.*) - [E=BASE:/services]
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteCond %{ENV:REDIRECT_STATUS} ^$
    RewriteRule ^app\.php(/(.*)|$) %{ENV:BASE}/$2 [R=301,L]
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule .? - [L]
    RewriteRule .? %{ENV:BASE}/app.php [L]
</Location>

# LOCATION FOR UPLOADING DOCUMENTS FROM MAP EDITING
<Location "/services/files">
    RewriteEngine On
    RewriteOptions inherit
    RewriteBase /services/files
    RewriteCond %{REQUEST_FILENAME} -s [OR]
    RewriteCond %{REQUEST_FILENAME} -l
    RewriteRule ^.*$ - [NC,L]
    RewriteRule ^.*$ index.php [NC,L]
</Location>

# LOCATION FOR THE AUTHOR DOCUMENTS TOOL
<Location "/services/documents">
    RewriteEngine On
    RewriteOptions inherit
    RewriteBase /services/documents
    RewriteCond %{REQUEST_FILENAME} -s [OR]
    RewriteCond %{REQUEST_FILENAME} -l
    RewriteRule ^.*$ - [NC,L]
    RewriteRule ^.*$ index.php [NC,L]
</Location>

ErrorLog /dev/stderr
TransferLog /dev/stdout
