# add custom guard to secure some services in public/services/...
security:
    firewalls:
        r3gis_apps:
            pattern: ^/r3gis_apps/
            guard: GisClient\Author\Security\Guard\TokenAuthenticator
            provider: GisClient\Author\Security\User\R3UserProvider
        default:
            pattern: ^/
            guard: GisClient\Author\Security\Guard\UsernamePasswordAuthenticator
            provider: GisClient\Author\Security\User\UserProvider
    access_control:
        -
            path: '^\/r3gis_apps\/(autocomplete.php|gcmap.php|gcmapconfig.php|geolocator.php|login|refresh).*'
            authenticated: false
        -
            path: '^\/(autocomplete.php|download.php|gcmap.php|gcmapconfig.php|geolocator.php|login|refresh).*'
            authenticated: false
        -
            path: ^/
            authenticated: true
