name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend
  OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
  VALIDATE_PLATFORMS: linux/amd64,linux/arm64
  PUBLISH_PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare environment
        run: cp .env.dist .env

      - name: Start services
        run: make start

      - name: Install dependencies
        run: make deps

      - name: Run tests
        run: make test-ci

      - name: Stop services
        if: always()
        run: make clean

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare environment
        run: cp .env.dist .env

      - name: Start services
        run: make start

      - name: Install dependencies
        run: make deps

      - name: Run quality checks
        run: make quality-ci

      - name: Stop services
        if: always()
        run: make clean

  prepare-release:
    runs-on: ubuntu-latest
    needs:
      - test
      - quality
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      git_sha: ${{ steps.metadata.outputs.git_sha }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      versioned_tag: ${{ steps.metadata.outputs.versioned_tag }}
      oci_source: ${{ steps.metadata.outputs.oci_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute release metadata
        id: metadata
        run: |
          app_version="$(scripts/release-metadata.sh parse-version)"
          git_sha="$(scripts/release-metadata.sh git-sha)"
          build_number="${GITHUB_RUN_NUMBER}"
          versioned_tag="${app_version}-${build_number}"
          scripts/release-metadata.sh write-version-file

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${git_sha}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "versioned_tag=${versioned_tag}" >> "$GITHUB_OUTPUT"
          echo "oci_source=${OCI_SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Show release metadata
        run: |
          echo "Resolved version: ${{ steps.metadata.outputs.app_version }}"
          echo "Versioned tag: ${{ steps.metadata.outputs.versioned_tag }}"
          cat version.txt

      - name: Upload version file
        uses: actions/upload-artifact@v6
        with:
          name: version-file
          path: version.txt
          if-no-files-found: error

  build-and-validate-images:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download version file
        uses: actions/download-artifact@v4
        with:
          name: version-file
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and validate multi-arch images with Bake
        uses: docker/bake-action@v6
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          VERSIONED_TAG: ${{ needs.prepare-release.outputs.versioned_tag }}
          GIT_SHA: ${{ needs.prepare-release.outputs.git_sha }}
          OCI_SOURCE: ${{ needs.prepare-release.outputs.oci_source }}
          VALIDATE_PLATFORMS: ${{ env.VALIDATE_PLATFORMS }}
        with:
          source: .
          files: docker-bake.hcl
          targets: validate

  publish:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-and-validate-images
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download version file
        uses: actions/download-artifact@v4
        with:
          name: version-file
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish multi-arch images with Bake
        uses: docker/bake-action@v6
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          VERSIONED_TAG: ${{ needs.prepare-release.outputs.versioned_tag }}
          GIT_SHA: ${{ needs.prepare-release.outputs.git_sha }}
          OCI_SOURCE: ${{ needs.prepare-release.outputs.oci_source }}
          PUBLISH_PLATFORMS: ${{ env.PUBLISH_PLATFORMS }}
        with:
          source: .
          files: docker-bake.hcl
          targets: publish
          push: true
