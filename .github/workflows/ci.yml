name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PLATFORM: linux/amd64
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend
  OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.dist .env

      - name: Start services
        run: make start

      - name: Install dependencies
        run: make deps

      - name: Run tests
        run: make test-ci

      - name: Stop services
        if: always()
        run: make clean

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.dist .env

      - name: Start services
        run: make start

      - name: Install dependencies
        run: make deps

      - name: Run quality checks
        run: make quality-ci

      - name: Stop services
        if: always()
        run: make clean

  prepare-release:
    runs-on: ubuntu-latest
    needs:
      - test
      - quality
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      git_sha: ${{ steps.metadata.outputs.git_sha }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      versioned_tag: ${{ steps.metadata.outputs.versioned_tag }}
      oci_source: ${{ steps.metadata.outputs.oci_source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release metadata
        id: metadata
        run: |
          app_version="$(scripts/release-metadata.sh parse-version)"
          git_sha="$(scripts/release-metadata.sh git-sha)"
          build_number="${GITHUB_RUN_NUMBER}"
          versioned_tag="${app_version}-${build_number}"
          scripts/release-metadata.sh write-version-file

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${git_sha}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "versioned_tag=${versioned_tag}" >> "$GITHUB_OUTPUT"
          echo "oci_source=${OCI_SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Show release metadata
        run: |
          echo "Resolved version: ${{ steps.metadata.outputs.app_version }}"
          echo "Versioned tag: ${{ steps.metadata.outputs.versioned_tag }}"
          cat version.txt

      - name: Upload version file
        uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: version.txt
          if-no-files-found: error

  build-backend:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download version file
        uses: actions/download-artifact@v4
        with:
          name: version-file
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          target: prod
          platforms: ${{ env.PLATFORM }}
          load: false
          push: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ needs.prepare-release.outputs.versioned_tag }}
          build-args: |
            OCI_VERSION=${{ needs.prepare-release.outputs.versioned_tag }}
            OCI_REVISION=${{ needs.prepare-release.outputs.git_sha }}
            OCI_SOURCE=${{ needs.prepare-release.outputs.oci_source }}
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Upload backend image archive
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          if-no-files-found: error

  build-frontend:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download version file
        uses: actions/download-artifact@v4
        with:
          name: version-file
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          target: prod
          platforms: ${{ env.PLATFORM }}
          load: false
          push: false
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ needs.prepare-release.outputs.versioned_tag }}
          build-args: |
            OCI_VERSION=${{ needs.prepare-release.outputs.versioned_tag }}
            OCI_REVISION=${{ needs.prepare-release.outputs.git_sha }}
            OCI_SOURCE=${{ needs.prepare-release.outputs.oci_source }}
          outputs: type=docker,dest=/tmp/frontend-image.tar

      - name: Upload frontend image archive
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-backend
      - build-frontend
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download backend image archive
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Download frontend image archive
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp

      - name: Load backend image
        run: docker load --input /tmp/backend-image.tar

      - name: Load frontend image
        run: docker load --input /tmp/frontend-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push backend images
        run: |
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${BACKEND_IMAGE}:${VERSIONED_TAG}"
        env:
          VERSIONED_TAG: ${{ needs.prepare-release.outputs.versioned_tag }}

      - name: Push frontend images
        run: |
          docker push "${FRONTEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:${VERSIONED_TAG}"
        env:
          VERSIONED_TAG: ${{ needs.prepare-release.outputs.versioned_tag }}
